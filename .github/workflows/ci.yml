name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[dev]
          pip install ruff mypy pytest-cov pip-audit moto

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Format check
        run: ruff format --check app/ tests/

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports || true

      - name: Security audit (pip-audit)
        run: pip-audit --ignore-vuln GHSA-wqvq-5m8c-6g24 || true

      - name: Run tests
        env:
          NKS_WDC_CATALOG_DEV: "1"
        run: pytest -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image (smoke)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: wdc-catalog-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
